[workspace]
members = ["e2e", "example-plugin", "macros"]

[package]
name = "metamod-p"
version = "0.0.1"
edition = "2021"
license = "MIT"

[dependencies]
log = "0.4"
metamod-p-macros = { version = "0.0.1", path = "macros" }

[build-dependencies]
bindgen = "0.73"
miette = { version = "7", features = ["fancy"] } # optional but gives nicer error messages!

[features]
default = []

fallguys = []
