[workspace]
members = ["example-plugin"]

[package]
name = "metamod-p"
version = "0.0.1"
edition = "2021"
license = "MIT"

[dependencies]
const-default = { version = "1.0.0", features = ["std", "derive"] }

[build-dependencies]
bindgen = "0.73"
miette = { version = "7", features = ["fancy"] } # optional but gives nicer error messages!

[features]
default = []

fallguys = []
