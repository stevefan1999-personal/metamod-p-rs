[package]
name = "example-plugin"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
metamod-p = { version = "*", path = ".." }
log = "0.4"

# VC-LTL only links on MSVC; other targets would print a skip warning.
[target.'cfg(all(windows, target_env = "msvc"))'.dependencies]
vc-ltl = "5.3.1"

[features]
# Sven Co-op runs metamod-svencoop; see docs/adr/0001-metamod-flavour.md.
default = ["fallguys"]

fallguys = ["metamod-p/fallguys"]
